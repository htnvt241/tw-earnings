name: mops-probe

# 只能手動執行，不會自動排程，也不會修改任何檔案。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe MOPS
        run: python mops_probe.py

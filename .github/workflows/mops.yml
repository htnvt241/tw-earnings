name: update-mops

on:
  schedule:
    # 在台灣時間 12:23 到 23:23 之間，每小時的第 23 分鐘各跑一次，共 12 次。（GitHub 用 UTC，要減 8 小時）
    - cron: "23 4-15 * * *"
  workflow_dispatch:        # 允許在 Actions 頁面手動執行

permissions:
  contents: write

# 與 update-earnings 共用同一個群組，兩者不會同時改檔案
concurrency:
  group: update-earnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch MOPS realtime announcements
        run: python fetch_mops.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings.json data/mops_seen.json
          git diff --cached --quiet && exit 0
          git commit -m "update mops $(date -u +%F-%H%M)"
          git pull --rebase
          git push

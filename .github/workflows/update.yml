name: update-earnings

on:
  schedule:  
    - cron: "47 2,6,10,14,18,22 * * *"   # 每 4 小時第 47 分鐘（台灣時間 02:47、06:47、10:47、14:47、18:47、22:47）
  workflow_dispatch:        # 允許在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-earnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch earnings announcements
        run: python fetch_earnings.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings.json
          git diff --cached --quiet && exit 0
          git commit -m "update earnings $(date -u +%F)"
          git push

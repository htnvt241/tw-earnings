<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>財報公告追蹤｜毛利率與營業利益率</title>
<style>
:root{--bg:#f2f4f6;--panel:#fff;--ink:#16212b;--sub:#5b6875;--line:#dfe4e9;--bar:#2f6f8f;--bar-bg:#e6ecf0;--up:#c62828;--down:#1b7f3b;--hover:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--panel:#18212a;--ink:#e8edf1;--sub:#93a1ad;--line:#2a3640;--bar:#6bb3d3;--bar-bg:#263540;--up:#ff6b6b;--down:#4cc67a;--hover:#1d2832}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0}
.sub{color:var(--sub);font-size:13px;margin:2px 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;height:36px}
input[type=search]{flex:1;min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;color:var(--sub);background:none;border:0;padding:6px 14px;height:34px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--bar);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0 0 14px}
.stats div{font-size:13px;color:var(--sub)}
.stats b{display:block;font-size:24px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:760px;font-variant-numeric:tabular-nums}
th{font-size:13px;font-weight:500;color:var(--sub);text-align:left;padding:10px 12px;cursor:pointer;white-space:nowrap;user-select:none}
th.r,td.r{text-align:right}
td{padding:10px 12px;border-top:1px solid var(--line)}
tr.row{cursor:pointer}
tr.row:hover{background:var(--hover)}
.code{color:var(--sub);margin-left:4px}
.tag{font-size:12px;color:var(--sub);margin-left:6px}
.m{display:inline-block;min-width:54px;text-align:right}
.track{display:inline-block;width:56px;height:6px;margin-left:8px;border-radius:3px;background:var(--bar-bg);vertical-align:middle;overflow:hidden}
.track i{display:block;height:100%;background:var(--bar)}
.up{color:var(--up)}.down{color:var(--down)}.na{color:var(--sub)}
.detail td{background:var(--hover);font-size:13px;color:var(--sub)}
.detail span{margin-right:22px;white-space:nowrap}
.msg{padding:28px 16px;text-align:center;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>財報公告追蹤</h1>
  <p class="sub" id="meta">載入中…</p>
  <div class="bar">
    <label>財報期間 <select id="date"></select></label>
    <div class="seg" role="group" aria-label="數字基準">
      <button type="button" data-b="single" aria-pressed="true">單季</button>
      <button type="button" data-b="cum" aria-pressed="false">累計</button>
    </div>
    <input type="search" id="q" placeholder="搜尋代號或公司名稱" aria-label="搜尋">
  </div>
  <div class="stats" id="stats"></div>
  <div class="wrap">
    <table id="tbl">
      <thead><tr>
        <th data-k="announced" tabindex="0">公告時間</th>
        <th data-k="code" tabindex="0">公司</th>
        <th data-k="gm" class="r" tabindex="0">毛利率</th>
        <th data-k="om" class="r" tabindex="0">營業利益率</th>
        <th data-k="yoy" class="r" tabindex="0">較去年同期</th>
        <th data-k="qoq" class="r" tabindex="0">較上季</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="msg" id="msg" hidden></div>
  </div>
  <p class="note">單季為該季單獨的數字，累計為年初到該季末的合計（累計只有近期公告的季別才有）。「較去年同期」「較上季」是單季毛利率的百分點變化，紅色上升、綠色下降。「≈」表示單季由累計數字推算，小公司可能有些微誤差。毛利率＝營業毛利（毛損）÷營業收入。金融保險業沒有營業毛利，顯示「不適用」。歷史資料來自 XQ，近期公告來自公開資訊觀測站與證交所、櫃買中心 OpenAPI。</p>
</main>
<script>
const $=s=>document.querySelector(s);
let recs=[],hist={},S={},info={},R={},basis='single',sk='announced',sd=-1,openId=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':v.toFixed(1)+'%';
const shift=(l,d)=>{let y=+l.slice(0,4),q=+l[5]+d;while(q<1){q+=4;y--}while(q>4){q-=4;y++}return y+'Q'+q};
const ratio=(a,b)=>(a==null||b==null||!(b>0)||a===0)?null:a/b*100;
const cmp=(a,b)=>a>b?1:a<b?-1:0;
function prepare(){
  Object.entries(hist).forEach(([c,h])=>{
    info[c]={name:h.n,market:h.m,industry:h.i};S[c]={};
    h.g.forEach((g,k)=>{const o=h.o[k];if(g!=null||o!=null)S[c][shift(h.l,-k)]={gm:g,om:o,approx:false}})});
  recs.forEach(r=>{const l=r.year+'Q'+r.quarter;R[r.code+'|'+l]=r;
    info[r.code]=Object.assign({industry:''},info[r.code],{name:r.name,market:r.market});
    if(r.q){S[r.code]=S[r.code]||{};S[r.code][l]={gm:ratio(r.q.gp,r.q.rev),om:ratio(r.q.op,r.q.rev),approx:!!r.q.approx}}})}
function labels(){const s=new Set(recs.map(r=>r.year+'Q'+r.quarter));
  Object.values(S).forEach(m=>Object.keys(m).forEach(l=>s.add(l)));return[...s].sort().reverse()}
function build(code,P){
  const rec=R[code+'|'+P],inf=info[code]||{},fin=/金融/.test(inf.industry||'');
  let cur=null,yoy=null,qoq=null;
  if(basis==='single'){cur=S[code]&&S[code][P]||null;
    const y=S[code]&&S[code][shift(P,-4)],q=S[code]&&S[code][shift(P,-1)];
    const d=(a,b)=>a==null||b==null?null:a-b;
    if(cur){yoy=y?d(cur.gm,y.gm):null;qoq=q?d(cur.gm,q.gm):null}}
  else if(rec)cur={gm:ratio(rec.gp,rec.rev),om:ratio(rec.op,rec.rev),approx:false};
  return{code,rec,inf,fin,cur,gm:cur?cur.gm:null,om:cur?cur.om:null,yoy,qoq}}
function cell(v,fin,approx){if(fin)return'<span class="na">不適用</span>';if(v==null)return'<span class="na">—</span>';
  const w=Math.max(0,Math.min(v,60))/60*100;
  return`<span class="m">${approx?'≈':''}${pct(v)}</span><span class="track"><i style="width:${w}%"></i></span>`}
function chg(v){if(v==null)return'<span class="na">—</span>';
  return`<span class="${v>0?'up':v<0?'down':'na'}">${v>0?'+':''}${v.toFixed(1)}</span>`}
function render(){
  const P=$('#date').value,s=$('#q').value.trim();
  const codes=Object.keys(info).filter(c=>R[c+'|'+P]||(S[c]&&S[c][P]));
  let rows=codes.map(c=>build(c,P)).filter(x=>!s||x.code.includes(s)||(x.inf.name||'').includes(s));
  rows.sort((a,b)=>{let x,y;
    if(sk==='announced'){x=a.rec&&a.rec.announced;y=b.rec&&b.rec.announced}
    else if(sk==='code'){x=a.code;y=b.code}else{x=a[sk];y=b[sk]}
    if(x==null&&y==null)return cmp(a.code,b.code);if(x==null)return 1;if(y==null)return -1;
    return(cmp(x,y)||cmp(a.code,b.code))*sd});
  const avg=k=>{const a=rows.filter(x=>!x.fin).map(x=>x[k]).filter(v=>v!=null).sort((p,c)=>p-c);return a.length?(a[(a.length-1)>>1]+a[a.length>>1])/2:null};
  const have=rows.filter(x=>x.yoy!=null),up=have.filter(x=>x.yoy>0).length;
  $('#stats').innerHTML=`<div>家數<b>${rows.length}</b></div><div>毛利率中位數<b>${pct(avg('gm'))}</b></div><div>營業利益率中位數<b>${pct(avg('om'))}</b></div><div>毛利率高於去年同期<b>${have.length?up+' / '+have.length:'—'}</b></div>`;
  const msg=$('#msg');
  if(!rows.length){msg.hidden=false;msg.textContent='這個條件下沒有資料。';$('#tb').innerHTML='';return}
  msg.hidden=true;
  $('#tb').innerHTML=rows.map(x=>{const r=x.rec,id=x.code+'|'+P,det=openId===id,ap=x.cur&&x.cur.approx;
    const t=r?(r.announced?r.announced.slice(5,16):'<span class="na">較早公告</span>'):'<span class="na">—</span>';
    return`<tr class="row" data-id="${id}"><td>${t}</td>
<td><b>${esc(x.inf.name||'')}</b><span class="code">${x.code}</span><span class="tag">${x.inf.market||''}${x.inf.industry?'・'+esc(x.inf.industry):''}${r&&r.kind?'・'+r.kind:''}</span></td>
<td class="r">${cell(x.gm,x.fin,ap)}</td><td class="r">${cell(x.om,x.fin,ap)}</td><td class="r">${chg(x.yoy)}</td><td class="r">${chg(x.qoq)}</td></tr>`+
(det?`<tr class="detail"><td colspan="6">${r?`<span>營業收入 ${r.rev==null?'—':r.rev.toLocaleString()}</span><span>營業毛利 ${r.gp==null?'—':r.gp.toLocaleString()}</span><span>營業利益 ${r.op==null?'—':r.op.toLocaleString()}</span><span>單位：仟元（年初累計）</span><br>${esc(r.subject||'')}`:'此期間沒有近期公告的累計金額；數字來自 XQ 歷史資料。'}</td></tr>`:'')}).join('')}
$('#tb').onclick=e=>{const t=e.target.closest('tr.row');if(!t)return;openId=openId===t.dataset.id?null:t.dataset.id;render()};
document.querySelectorAll('th').forEach(h=>{const f=()=>{const k=h.dataset.k;if(sk===k)sd=-sd;else{sk=k;sd=k==='code'?1:-1}render()};
  h.onclick=f;h.onkeydown=e=>{if(e.key==='Enter')f()}});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{basis=b.dataset.b;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#date').onchange=render;$('#q').oninput=render;
const getJ=(u,opt)=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' HTTP '+r.status);return r.json()}).catch(e=>{if(opt)return null;throw e});
Promise.all([getJ('data/earnings.json'),getJ('data/history.json',true)]).then(([j,h])=>{
  recs=j.records;hist=(h&&h.companies)||{};prepare();
  const ls=labels(),latest=recs.map(r=>r.year+'Q'+r.quarter).sort().reverse()[0]||ls[0];
  $('#date').innerHTML=ls.map(l=>`<option value="${l}"${l===latest?' selected':''}>${l.slice(0,4)} Q${l[5]}</option>`).join('');
  $('#meta').textContent=`資料更新時間 ${j.updated_at}　近期公告 ${recs.length} 筆　歷史資料 ${Object.keys(hist).length} 家`;
  try{render()}catch(e){console.error(e);$('#meta').textContent='';const m=$('#msg');m.hidden=false;m.textContent='資料已讀取，但畫面產生時出錯：'+e.message}
}).catch(e=>{console.error(e);$('#meta').textContent='';const m=$('#msg');m.hidden=false;
  m.textContent='讀不到資料（'+e.message+'）。直接雙擊 index.html 開啟會失敗，請用 GitHub Pages 的網址開啟；也請確認儲存庫裡有 data/earnings.json。'});
</script>
</body>
</html>
